<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VyaparAI – Smart Billing, Inventory & AI Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
tailwind.config={
  darkMode:'class',
  theme:{extend:{
    fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']},
    colors:{brand:{50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',500:'#6366f1',600:'#4f46e5',700:'#4338ca',900:'#1e1b4b'}}
  }}
}
</script>
<style>
:root{--bg1:#f7f5ff;--bg2:#e9f0ff;--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.82);--gb:rgba(255,255,255,.85);--bd:rgba(109,91,208,.16);--tx:#1a1a2e;--mu:#555b73;--ac:#6D5BD0;--ac2:#4F7CFF;--pn:rgba(255,255,255,.9);
 --sh:0 1px 1px rgba(30,20,80,.04),0 8px 24px -10px rgba(60,40,140,.18),0 28px 50px -28px rgba(60,40,140,.22);--shh:0 2px 2px rgba(30,20,80,.05),0 18px 38px -12px rgba(60,40,140,.32),0 38px 64px -28px rgba(60,40,140,.32)}
html.dark{--bg1:#0B0F1A;--bg2:#111827;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);--gb:rgba(255,255,255,.1);--bd:rgba(255,255,255,.11);--tx:#eef0fa;--mu:#a3aac2;--ac:#a99bff;--pn:rgba(17,24,39,.9);
 --sh:0 1px 1px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.65);--shh:0 2px 2px rgba(0,0,0,.35),0 20px 46px -14px rgba(109,91,208,.5)}
html{background:var(--bg1);color-scheme:light;transition:background-color .3s}
html.dark{color-scheme:dark}
body{font-family:Inter,system-ui,sans-serif;color:var(--tx);background:transparent;min-height:100vh;transition:color .3s;-webkit-font-smoothing:antialiased}
*,*::before,*::after{transition-property:background-color,border-color,color,fill,stroke,box-shadow,opacity,transform;transition-duration:.3s;transition-timing-function:ease}
canvas,svg *{transition:none}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
/* ambient background */
#ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(1200px 700px at 10% -10%,var(--bg2),transparent),linear-gradient(160deg,var(--bg1),var(--bg2))}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:drift 24s ease-in-out infinite alternate}
html.dark .blob{opacity:.3}
.b1{width:520px;height:520px;background:#a99bff;left:-120px;top:-100px}
.b2{width:460px;height:460px;background:#7aa2ff;right:-120px;top:20%;animation-duration:30s}
.b3{width:400px;height:400px;background:#f0a6ff;left:35%;bottom:-160px;animation-duration:27s;animation-delay:-8s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(60px,40px,0) scale(1.15)}}
#app{position:relative;z-index:2}
/* glass */
.card{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--sh)}
.kpi,.prod,.lift{transform-style:preserve-3d;will-change:transform;transition:transform .18s ease,box-shadow .25s ease,border-color .3s,background-color .3s}
.kpi:hover,.prod:hover,.lift:hover{box-shadow:var(--shh);transform:translateY(-4px)}
.kpi::after,.prod::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.4),transparent 55%);transition:opacity .25s}
html.dark .kpi::after,html.dark .prod::after{background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(169,155,255,.22),transparent 55%)}
.kpi:hover::after,.prod:hover::after{opacity:1}
.prod{cursor:pointer}
.view-enter{animation:slideIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translate3d(18px,10px,0) scale(.985)}to{opacity:1;transform:none}}
/* type */
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ac)}
.grad{background:linear-gradient(90deg,#6D5BD0,#4F7CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
html.dark .grad{background-image:linear-gradient(90deg,#b7a9ff,#7aa2ff)}
html .text-gray-400{color:#667085}html .text-gray-500{color:#586174}html .text-gray-600{color:#454d60}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:600;font-size:.85rem;padding:.6rem 1.2rem;border-radius:999px;cursor:pointer;white-space:nowrap;transition:transform .12s,box-shadow .2s,background-color .25s,border-color .25s,color .25s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(0,0,0,.18)!important}
.btn .arr{display:inline-block;transition:transform .2s}.btn:hover .arr{transform:translateX(4px)}
.btn-primary{background:#1a1a2e;color:#fff;box-shadow:0 8px 18px -8px rgba(26,26,46,.7),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:hover{background:#2a2a48;transform:translateY(-1px)}
html.dark .btn-primary{background:linear-gradient(135deg,#7c5cff,#4F7CFF);box-shadow:0 10px 24px -8px rgba(124,92,255,.65),inset 0 1px 0 rgba(255,255,255,.3)}
html.dark .btn-primary:hover{background:linear-gradient(135deg,#8d70ff,#6590ff)}
.btn-ghost{background:var(--glass2);border:1px solid var(--bd);color:var(--tx)}.btn-ghost:hover{border-color:var(--ac);transform:translateY(-1px)}
.btn-green{background:#16A34A;color:#fff;box-shadow:0 8px 18px -8px rgba(22,163,74,.7)}.btn-green:hover{background:#15803d}
.btn-red{background:rgba(220,38,38,.12);color:#DC2626}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ibtn{position:relative;width:40px;height:40px;border-radius:999px;display:inline-grid;place-items:center;background:var(--glass2);border:1px solid var(--bd);cursor:pointer;font-size:1rem;color:var(--tx);flex:none;transition:transform .12s,border-color .2s}
.ibtn:hover{border-color:var(--ac)}.ibtn:active{transform:translateY(2px)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:#DC2626;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.theme-ic{position:relative;width:20px;height:20px;display:block}
.theme-ic svg{position:absolute;inset:0;transition:opacity .35s,transform .6s cubic-bezier(.2,.8,.2,1)}
.theme-ic .sun{opacity:1;transform:rotate(0)}.theme-ic .moon{opacity:0;transform:rotate(-120deg) scale(.5)}
html.dark .theme-ic .sun{opacity:0;transform:rotate(120deg) scale(.5)}html.dark .theme-ic .moon{opacity:1;transform:rotate(0)}
.seg{display:flex;background:var(--glass2);border:1px solid var(--bd);border-radius:999px;padding:3px}
.seg button{border-radius:999px;padding:.38rem .85rem;font-size:.75rem;font-weight:700;color:var(--mu);transition:all .2s;white-space:nowrap}
.seg button.on{background:#1a1a2e;color:#fff}html.dark .seg button.on{background:linear-gradient(135deg,#7c5cff,#4F7CFF)}
.inp{border:1px solid var(--bd);border-radius:14px;padding:.55rem .85rem;font-size:.875rem;outline:none;background:var(--glass2);color:var(--tx);width:100%}
.inp::placeholder{color:#7b8296}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(109,91,208,.2)}
html.dark .inp:focus{box-shadow:0 0 0 4px rgba(169,155,255,.25)}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.22rem .65rem;border-radius:999px;font-size:.72rem;font-weight:600}
.th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:700;text-align:left;padding:.7rem .8rem;white-space:nowrap}
.td{padding:.65rem .8rem;font-size:.85rem;border-top:1px solid var(--bd);vertical-align:middle}
/* nav */
#side>div{border-radius:28px}
.nav-btn{display:flex;align-items:center;gap:.7rem;width:100%;padding:.62rem .9rem;border-radius:999px;font-weight:600;font-size:.86rem;color:var(--mu);transition:all .2s;cursor:pointer}
.nav-btn:hover{background:rgba(109,91,208,.12);color:var(--ac)}
.nav-btn.active{background:#1a1a2e;color:#fff;box-shadow:0 10px 22px -10px rgba(26,26,46,.8)}
html.dark .nav-btn.active{background:linear-gradient(135deg,#7c5cff,#4F7CFF);box-shadow:0 10px 24px -8px rgba(124,92,255,.7)}
.nav-main{padding:.8rem 1rem;font-size:.92rem}
.nav-btn.locked{opacity:.7}
.nav-lbl{font-size:.65rem;letter-spacing:.14em;font-weight:700;color:var(--mu);padding:.7rem .9rem .25rem}
#bnav{position:fixed;left:10px;right:10px;bottom:10px;z-index:40;display:flex;justify-content:space-around;padding:6px;border-radius:26px;background:var(--pn);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--gb);box-shadow:var(--shh)}
#bnav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:600;color:var(--mu);padding:6px 10px;border-radius:18px;min-width:56px}
#bnav button.active{color:#fff;background:#1a1a2e}html.dark #bnav button.active{background:linear-gradient(135deg,#7c5cff,#4F7CFF)}
@media (max-width:1023px){#view{padding-bottom:96px}}
header.gh{position:sticky;top:0;z-index:30;background:var(--pn);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--gb)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;perspective:1400px}
.modal.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(15,15,40,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .25s}
.panel{position:relative;background:var(--pn);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--gb);border-radius:26px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 40px 90px -24px rgba(20,10,70,.6);color:var(--tx);transform-origin:50% 0;animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:rotateX(8deg) translateY(28px) scale(.95)}to{opacity:1;transform:none}}
#toasts{position:fixed;right:1rem;bottom:1rem;z-index:80;display:flex;flex-direction:column;gap:.5rem}
@media (max-width:1023px){#toasts{bottom:92px}}
.toast{background:rgba(26,26,46,.9);color:#fff;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:.7rem 1.1rem;border-radius:16px;font-size:.85rem;box-shadow:0 14px 34px -12px rgba(0,0,0,.55);animation:slideIn .3s;max-width:340px;border:1px solid rgba(255,255,255,.1)}
.toast.ok{background:rgba(21,128,61,.92)}.toast.warn{background:rgba(180,83,9,.94)}.toast.err{background:rgba(185,28,28,.94)}
.tip{position:fixed;z-index:95;padding:.55rem .9rem;border-radius:14px;font-size:.78rem;font-weight:600;background:var(--pn);color:var(--tx);border:1px solid var(--gb);box-shadow:var(--shh);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:slideIn .25s;pointer-events:none}
/* voice */
.mic{position:relative;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#4F7CFF);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.9rem;cursor:pointer;flex:none;box-shadow:0 14px 30px -10px #6D5BD0,inset 0 2px 0 rgba(255,255,255,.35)}
.mic::before,.mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #8b7bff;opacity:0}
.listening .mic::before{animation:ring 1.4s infinite}.listening .mic::after{animation:ring 1.4s .5s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(2);opacity:0}}
.wave{display:flex;align-items:center;gap:3px;height:28px;opacity:.25}
.wave i{width:3px;height:6px;border-radius:2px;background:var(--ac2);display:block}
.listening .wave{opacity:1}.listening .wave i{animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:5px}50%{height:26px}}
/* receipt / ocr */
.paper{background:#fffef8;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.35;color:#111;padding:18px 16px;border-radius:4px;box-shadow:0 8px 24px -10px rgba(0,0,0,.35);white-space:pre;overflow-x:auto}
.printing{animation:feed 2.2s ease-in-out}
@keyframes feed{0%{transform:translateY(-14px);opacity:.3}60%{transform:translateY(4px);opacity:1}100%{transform:none}}
.scanbox{position:relative;overflow:hidden}
.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#22c55e,transparent);box-shadow:0 0 14px 4px rgba(34,197,94,.55);animation:scan 1.3s linear infinite}
@keyframes scan{0%{top:0}100%{top:100%}}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#16A34A;animation:pd 1.4s infinite}
@keyframes pd{0%{box-shadow:0 0 0 0 rgba(22,163,74,.6)}100%{box-shadow:0 0 0 9px rgba(22,163,74,0)}}
.soundbox{animation:sb .5s ease}
@keyframes sb{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.spin{width:22px;height:22px;border:3px solid rgba(109,91,208,.25);border-top-color:#6D5BD0;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;transition:none}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{border:2px dashed var(--ac);border-radius:22px;background:rgba(109,91,208,.05);box-shadow:0 0 0 0 rgba(109,91,208,.3);animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(109,91,208,.0)}50%{box-shadow:0 0 22px 2px rgba(109,91,208,.28)}}
.drop.over{background:rgba(109,91,208,.14)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(109,91,208,.3);border-radius:8px}
.noscroll::-webkit-scrollbar{display:none}
.skel{background:linear-gradient(90deg,var(--glass) 25%,var(--glass2) 50%,var(--glass) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:18px}
@keyframes sk{to{background-position:-200% 0}}
/* orbs */
.orb{position:absolute;pointer-events:none;z-index:1;transform:translate3d(calc(var(--px,0)*var(--d,10)*1px),calc(var(--py,0)*var(--d,10)*1px),0);transition:transform .25s ease-out}
.orb i{display:block;width:100%;height:100%;border-radius:50%;position:relative;background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,.55) 8%,transparent 9%),radial-gradient(circle at 35% 30%,#d6ccff,#7c5cff 55%,#3b2f8f 100%);box-shadow:inset -10px -16px 28px rgba(20,10,80,.35),inset 8px 10px 18px rgba(255,255,255,.35),0 30px 40px -14px rgba(109,91,208,.55);animation:bob 6s ease-in-out infinite}
.orb.blue i{background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,.55) 8%,transparent 9%),radial-gradient(circle at 35% 30%,#cfe0ff,#4F7CFF 55%,#1d3a8a 100%);box-shadow:inset -10px -16px 28px rgba(10,20,80,.35),inset 8px 10px 18px rgba(255,255,255,.35),0 30px 40px -14px rgba(79,124,255,.55)}
.orb.slow i{animation-duration:8.5s;animation-delay:-3s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(6deg)}}
/* login */
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.ring-bg{stroke:rgba(255,255,255,.22)}
.ring-fg{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.hero-grad{background:linear-gradient(135deg,#2b2160,#4a3bb0 55%,#4F7CFF);color:#fff;position:relative;overflow:hidden}
.orb~*{position:relative;z-index:2}
@media (max-width:640px){.orb{opacity:.55}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}.orb{transform:none!important}}

/* Generic container inversions */
html.dark .bg-white{background-color:rgba(255,255,255,.07)!important}
html.dark .bg-gray-50{background-color:#151d30!important}
html.dark .bg-gray-100{background-color:#192238!important}
html.dark .bg-gray-200{background-color:#222d47!important}
html.dark .border-gray-100,html.dark .border-gray-200{border-color:rgba(255,255,255,.08)!important}
html.dark .text-gray-900,html.dark .text-gray-800,html.dark .text-gray-700{color:#f1f5f9!important}
html.dark .text-gray-600{color:#cbd5e1!important}
html.dark .text-gray-500{color:#94a3b8!important}
html.dark .text-gray-400{color:#64748b!important}
html.dark .text-brand-700{color:#a5b4fc!important}
html.dark .text-brand-600{color:#818cf8!important}


/* Tinted cards & badges */
html.dark .bg-indigo-50,html.dark .bg-brand-50{background-color:rgba(99,102,241,.12)!important;border-color:rgba(99,102,241,.25)!important;color:#c7d2fe!important}
html.dark .bg-amber-50{background-color:rgba(245,158,11,.12)!important;border-color:rgba(245,158,11,.25)!important;color:#fde68a!important}
html.dark .bg-red-50{background-color:rgba(239,68,68,.12)!important;border-color:rgba(239,68,68,.25)!important;color:#fca5a5!important}
html.dark .bg-emerald-50{background-color:rgba(16,185,129,.12)!important;border-color:rgba(16,185,129,.25)!important;color:#a7f3d0!important}
html.dark .bg-sky-50,html.dark .bg-blue-50{background-color:rgba(14,165,233,.12)!important;border-color:rgba(14,165,233,.25)!important;color:#bae6fd!important}

html.dark .chip.bg-gray-100{background-color:#1c263c!important;color:#94a3b8!important}
html.dark .chip.bg-brand-50{background-color:rgba(99,102,241,.2)!important;color:#c7d2fe!important}
html.dark .chip.bg-emerald-100{background-color:rgba(16,185,129,.2)!important;color:#6ee7b7!important}
html.dark .chip.bg-red-100{background-color:rgba(239,68,68,.2)!important;color:#fca5a5!important}
html.dark .chip.bg-amber-100{background-color:rgba(245,158,11,.2)!important;color:#fcd34d!important}
html.dark .chip.bg-blue-100{background-color:rgba(59,130,246,.2)!important;color:#93c5fd!important}

html.dark .text-emerald-700,html.dark .text-emerald-600{color:#34d399!important}
html.dark .text-red-700,html.dark .text-red-600{color:#f87171!important}
html.dark .text-amber-700,html.dark .text-amber-600{color:#fbbf24!important}

/* Special components in dark mode */
html.dark #voice{background:linear-gradient(135deg,#111726,#161a35)!important;border:1px solid rgba(99,102,241,.25)}
html.dark .drop{border-color:rgba(99,102,241,.3)}
html.dark .drop.over{background:rgba(99,102,241,.15);border-color:#6366f1}
html.dark .scanbox{background:#090d16}
html.dark ::-webkit-scrollbar-track{background:#0a0e18}
html.dark ::-webkit-scrollbar-thumb{background:#222f46}
html.dark ::-webkit-scrollbar-thumb:hover{background:#35476a}
</style>
</head>
<body>
<div id="ambient" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<!-- LOGIN -->
<div id="login" class="hidden fixed inset-0 z-40 overflow-y-auto">
  <div class="min-h-full flex items-center justify-center p-4 relative">
    <div class="orb" style="--d:30;left:8%;top:12%;width:150px;height:150px"><i></i></div>
    <div class="orb blue slow" style="--d:-22;right:10%;bottom:14%;width:110px;height:110px"><i></i></div>
    <div class="orb slow" style="--d:14;right:22%;top:10%;width:46px;height:46px"><i></i></div>
    <div class="w-full max-w-md relative z-10">
      <div id="lcard" class="card p-7 sm:p-9">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-brand-500 to-violet-600 text-white flex items-center justify-center font-extrabold text-lg shadow-lg">V</div>
          <div class="font-extrabold text-xl tracking-tight">Vyapar<span class="grad">AI</span></div>
        </div>
        <div class="eyebrow mt-7">Secure owner access</div>
        <h1 class="text-3xl font-extrabold tracking-tight mt-1">Welcome <span class="grad">back</span></h1>
        <p class="text-sm text-gray-500 mt-2">Your business data stays private and is visible only to you.</p>
        <form onsubmit="doLogin(event)" class="mt-6 space-y-4" autocomplete="off" novalidate>
          <div><label for="lu" class="text-xs font-bold text-gray-500 uppercase tracking-wide">Username</label><input id="lu" class="inp mt-1.5" autocomplete="username" placeholder="Enter username" required></div>

function mkSale(items,method,ts,products,disc,by){
  const f=1-(disc||0)/100; let sub0=0,cost=0,tax=0; const lines=[];
  items.forEach(it=>{const p=products.find(x=>x.id===it.id);const price=ep(p);const amt=price*it.qty;
    sub0+=amt;cost+=p.cost*it.qty;tax+=amt*f*p.gst/100;
    lines.push({id:p.id,name:p.name,unit:p.unit,qty:it.qty,price,cost:p.cost,gst:p.gst,cat:p.cat})});
  const sub=r2(sub0*f), total=Math.round(sub+tax);
  return {id:'',ts,items:lines,sub0:r2(sub0),disc:disc||0,sub,tax:r2(tax),round:r2(total-(sub+tax)),total,cost:r2(cost),method,voided:false,by:by||'Owner'};
}

      if(cfg.options.plugins.legend&&cfg.options.plugins.legend.labels){
        cfg.options.plugins.legend.labels.color=isDark?'#cbd5e1':'#374151';
      }
      if(!cfg.options.plugins.tooltip)cfg.options.plugins.tooltip={};
      cfg.options.plugins.tooltip.backgroundColor=isDark?'#1e293b':'#111827';

/* ---- Voice parsing: fuzzy matching + keyword extraction ---- */
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const sing=w=>w.length>3&&w.endsWith('s')?w.slice(0,-1):w;
const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,half:.5};
function tokMatch(a,b){return a===b||lev(a,b)<=(Math.max(a.length,b.length)>5?2:1)}
function matchProduct(phrase){
  const words=phrase.split(/\s+/).filter(Boolean).map(sing);if(!words.length)return null;let best=null,bs=0;
  S.products.forEach(p=>{[p.name,...p.al].forEach(k=>{const kt=k.toLowerCase().split(/\s+/).map(sing);
    const hit=kt.filter(t=>words.some(w=>tokMatch(t,w))).length;if(!hit)return;
    const sc=hit/kt.length+(hit/words.length)*.5;if(sc>bs){bs=sc;best=p}})});
  return bs>=.9?best:null;
}
function parseVoice(text){
  let t=text.toLowerCase().replace(/[^a-z0-9.,&\s]/g,' ').replace(/\b(please|add|give me|i want|want|need|get|also|of|me|bill|and a)\b/g,' ');
  const segs=t.split(/\s*(?:,|&|\band\b|\bplus\b|\bwith\b)\s*/).map(s=>s.trim()).filter(Boolean);
  const found=[],missed=[];
  segs.forEach(seg=>{
    let qty=1,unit=null;
    const m=seg.match(/(\d+(?:\.\d+)?|\b(?:an?|one|two|three|four|five|six|seven|eight|nine|ten|half)\b)\s*(kgs?|kilos?|kilograms?|grams?|gms?|g)?\b/);
    let rest=seg;
    if(m){qty=isNaN(m[1])?NUMW[m[1]]:parseFloat(m[1]);unit=m[2]||null;rest=seg.replace(m[0],' ')}
    if(unit&&/^g/.test(unit)&&!/^kg/.test(unit)&&unit!=='kilo')qty=qty/1000;
    const p=matchProduct(rest.trim());
    if(p){if(p.step<1&&unit==null&&qty%0.5)qty=Math.round(qty*2)/2;found.push({id:p.id,qty,name:p.name,unit:p.unit})}
    else missed.push(seg);
  });
  return {found,missed};
}
let voiceBusy=false;
async function runVoice(phrase){
  if(voiceBusy||!$('#voice'))return;voiceBusy=true;
  const w=$('#voice'),tr=$('#vtrans'),st=$('#vstatus');
  w.classList.add('listening');st.textContent='Listening…';st.className='chip bg-red-100 text-red-600';tr.textContent='';$('#vres').innerHTML='';
  await sleep(500);for(const ch of phrase){tr.textContent+=ch;await sleep(20)}
  st.textContent='Understanding…';st.className='chip bg-amber-100 text-amber-700';await sleep(500);
  const res=parseVoice(phrase);res.found.forEach(f=>addItem(f.id,f.qty,true));res.found.length?SFX.chime():SFX.buzz();
  $('#vres').innerHTML=res.found.map(f=>`<span class="chip bg-emerald-100 text-emerald-700 !text-xs !py-1">✓ ${f.qty} ${f.unit==='kg'?'kg ':'× '}${f.name}</span>`).join('')+res.missed.map(m=>`<span class="chip bg-red-100 text-red-600 !text-xs !py-1">? "${esc(m)}" not recognised</span>`).join('');
  w.classList.remove('listening');st.textContent=res.found.length?`Added ${res.found.length} item${res.found.length>1?'s':''}`:'No match';st.className='chip '+(res.found.length?'bg-emerald-100 text-emerald-700':'bg-gray-100 text-gray-500');
  voiceBusy=false;
}

function qrSVG(str){
  let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))>>>0;const R=rng(h%2147483646+1),N=25,s=7;let r='';
  const fin=(x,y)=>x<8&&y<8||x>=N-8&&y<8||x<8&&y>=N-8;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(fin(x,y))continue;if(R()>.52)r+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}"/>`}
  const f=(x,y)=>`<rect x="${x*s}" y="${y*s}" width="${7*s}" height="${7*s}" fill="#000"/><rect x="${(x+1)*s}" y="${(y+1)*s}" width="${5*s}" height="${5*s}" fill="#fff"/><rect x="${(x+2)*s}" y="${(y+2)*s}" width="${3*s}" height="${3*s}" fill="#000"/>`;
  return `<svg width="190" height="190" viewBox="0 0 ${N*s} ${N*s}"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${r}</g>${f(0,0)}${f(N-7,0)}${f(0,N-7)}</svg>`;
}

function receiptText(s){
  const W=32,ln=(l,r)=>l+' '.repeat(Math.max(1,W-l.length-r.length))+r,c=t=>' '.repeat(Math.max(0,(W-t.length)>>1))+t,hr='-'.repeat(W);
  const d=new Date(s.ts);let o=[c('VYAPARAI CAFE & DECOR'),c('12, MG Road, Pune 411001'),c('GSTIN 27AAPFV1234K1ZP'),c('Ph: 98765 43210'),hr,
    ln('Bill: '+s.id,d.toLocaleDateString('en-IN')),ln('By: '+s.by,d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})),hr,ln('ITEM','AMOUNT')];
  s.items.forEach(l=>{o.push(l.name.slice(0,W));o.push(ln('  '+l.qty+' '+l.unit+' x '+l.price.toFixed(2),(l.qty*l.price).toFixed(2)))});
  o.push(hr,ln('Subtotal',s.sub0.toFixed(2)));if(s.disc)o.push(ln('Discount '+s.disc+'%','-'+r2(s.sub0-s.sub).toFixed(2)));
  o.push(ln('CGST',(s.tax/2).toFixed(2)),ln('SGST',(s.tax/2).toFixed(2)),ln('Round off',s.round.toFixed(2)),hr,ln('TOTAL','Rs '+s.total.toFixed(2)),hr,ln('Paid via',s.method.toUpperCase()),'',c('Thank you! Visit again :)'),c('Powered by VyaparAI'));
  return o.join('\n');
}

async function csvRun(txt,name){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim()),hdr=(lines[0]||'').split(','),rows=lines.slice(1);
  const seen=new Set();let dup=0,miss=0;rows.forEach(l=>{if(seen.has(l))dup++;seen.add(l);l.split(',').forEach(c=>{if(!c.trim())miss++})});
  const el=$('#cproc');el.innerHTML=`<div class="rounded-xl bg-gray-50 border p-3"><div class="text-sm font-semibold mb-2">Processing ${esc(name)}</div><div id="csteps" class="space-y-1.5 text-sm"></div></div>`;
  const st=[['Reading file',`${rows.length} rows, ${hdr.length} columns detected`],['Cleaning',`${dup} duplicate rows removed, ${miss} missing values filled`],['Descriptive analysis','Sales totals & trends computed'],['Diagnostic analysis','Drivers of change identified'],['Predictive models','Forecasts refreshed'],['Opportunity detection & recommendations','Growth plan updated']];
  for(const s of st){$('#csteps').insertAdjacentHTML('beforeend',`<div class="flex items-center gap-2"><span class="spin !w-4 !h-4 !border-2"></span><span>${s[0]}</span></div>`);await sleep(520);$('#csteps').lastElementChild.innerHTML=`<span class="text-emerald-600 font-bold">✓</span><span>${s[0]} <span class="text-gray-400 text-xs">– ${s[1]}</span></span>`}
  el.insertAdjacentHTML('beforeend',`<div class="mt-3 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-sm text-emerald-800"><b>Done.</b> ${rows.length-dup} clean records merged. Preview: <div class="font-mono text-[11px] mt-1 overflow-x-auto whitespace-pre">${esc(lines.slice(0,4).join('\n'))}</div></div><button class="btn btn-primary w-full mt-3" onclick="closeM(1);go('advisor')">View updated recommendations</button>`);
  S.sources=S.sources||{};S.sources.csv=1;save();
}

    <div class="grid grid-cols-3 gap-2 mt-4 text-center"><div class="rounded-2xl p-3" style="background:var(--glass2)"><div class="text-xl font-extrabold">${m.count}</div><div class="text-[11px] text-gray-500">bills today</div></div><div class="rounded-2xl p-3" style="background:var(--glass2)"><div class="text-xl font-extrabold">${inr(Math.round(m.count?m.rev/m.count:0))}</div><div class="text-[11px] text-gray-500">avg bill</div></div><div class="rounded-2xl p-3" style="background:var(--glass2)"><div class="text-xl font-extrabold">🎙️</div><div class="text-[11px] text-gray-500">voice ready</div></div></div>
    <button class="btn btn-primary mt-5" onclick="go('pos')">Open billing counter →</button></div>
   <div class="card hero-grad p-6 lift"><div class="text-[11px] tracking-[.16em] uppercase font-bold opacity-80">Growth advisor</div><div class="flex flex-wrap items-center gap-5 mt-2"><div class="flex-1 min-w-[200px]"><h2 class="text-2xl font-extrabold">Digital Data Analyst</h2><p class="text-sm opacity-85 mt-2">${recs.length} recommendations worth ≈ <b>${inr(tot)}</b> a month. Top priority: <b>${top.title}</b></p></div>${ring(H.overall,128)}</div>
    <button class="btn mt-5 bg-white text-[#1a1a2e]" onclick="${isOwner()?"go('advisor')":'lockTip(event)'}">${isOwner()?'Open growth advisor →':'🔒 Owner only'}</button></div></div>
  <div class="grid grid-cols-2 xl:grid-cols-4 gap-4 mt-5">${kp("Today's revenue",`<span class="cnt" data-v="${Math.round(m.rev)}">${inr(Math.round(m.rev))}</span>`,m.count+' bills')}${kp('Net profit',inr(Math.round(m.net)),'after overheads',m.net>=0?'text-emerald-600':'text-red-600')}${kp('Dead stock locked',inr(locked(30)),deadItems(30).length+' items idle 30+ days','text-amber-600')}${kp('Low stock alerts',low,'items need reorder',low?'text-red-600':'')}</div>
  <div class="grid md:grid-cols-3 gap-4 mt-5">${[['🧊','Dead stock','Cash locked in slow movers',"dead"],['📥','Restock & OCR','Scan supplier bills',"restock"],['🌐','Market Intelligence','What sells & what is next',"market"]].map(x=>`<button class="card p-4 text-left lift flex items-center gap-3" onclick="${isOwner()?`go('${x[3]}')`:'lockTip(event)'}"><span class="text-3xl">${x[0]}</span><span><b>${x[1]}</b><span class="block text-xs text-gray-500">${x[2]}</span></span><span class="ml-auto">${isOwner()?'→':'🔒'}</span></button>`).join('')}</div>`;
}
function boot(){pos.cart=S.cart||[];pos.disc=S.cdisc||0;if(isAuthed())showApp(false);else showLogin()}

/* Init */
function tick(){const c=$('#clock');if(c)c.textContent=new Date().toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,30000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM(2);closeM(1)}});
boot();
</script>
</body>
</html>
